[workspace]
members = ["apps/api", "crates/core", "crates/application", "crates/adapters", "crates/database"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

# Versions reconciled with the supplied Rust template. Each crate opts into only
# the dependencies it actually consumes; identity dependencies arrive with policy.
[workspace.dependencies]
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "time", "fs", "sync"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.6.11", features = ["cors"] }
url = "=2.5.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }

async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
utoipa = { version = "6", features = ["chrono", "uuid"] }
utoipa-axum = "=0.3.0"
dotenvy = "=0.15.7"

sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
oauth2 = { version = "5", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.8"
base64 = "=0.22.1"
sha2 = "=0.10.9"
subtle = "=2.6.1"
cookie = "0.18.1"
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "symbols"
