name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the validated bundle
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the successful CI run for this exact release commit
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit=$(git rev-parse "$GITHUB_REF^{commit}")
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          artifact="factory-server-$commit"
          for attempt in $(seq 1 80); do
            runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main -f head_sha="$commit" -f status=success -F per_page=30 \
              --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id')
            while IFS= read -r run; do
              [[ -n "$run" ]] || continue
              artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts")
              if jq -e --arg artifact "$artifact" 'any(.artifacts[]; .name == $artifact and .expired == false)' <<< "$artifacts" >/dev/null; then
                printf 'run-id=%s\nartifact=%s\n' "$run" "$artifact" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done <<< "$runs"
            sleep 15
          done
          echo "No successful CI run has a current server bundle for $commit. Verify or rerun CI for that commit." >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.artifact }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Verify the bundle checksum
        working-directory: candidate
        run: sha256sum --check --strict factory-server.tar.gz.sha256
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested container digests
        shell: bash
        run: |
          set -euo pipefail
          images=$(tar -xOzf candidate/factory-server.tar.gz release.env)
          for component in api workspace egress; do
            package="ghcr.io/${GITHUB_REPOSITORY,,}-$component"
            ref=$(sed -n "s/^FACTORY_${component^^}_IMAGE=//p" <<< "$images")
            [[ "$ref" == "$package@sha256:"* && "${ref#*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
            tag="$package:$GITHUB_REF_NAME"
            if existing=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>/dev/null); then
              [[ "$existing" == "${ref#*@}" ]] || { echo "Release tag $tag already points to a different image" >&2; exit 1; }
            else
              docker buildx imagetools create --prefer-index=false --tag "$tag" "$ref"
            fi
          done
      - name: Attach the bundle to the GitHub Release
        working-directory: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets')
          for file in factory-server.tar.gz factory-server.tar.gz.sha256; do
            digest=$(jq -r --arg name "$file" '.[] | select(.name == $name) | .digest // "missing"' <<< "$assets")
            if [[ -z "$digest" ]]; then
              gh release upload "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY"
            elif [[ "$digest" != "sha256:$(sha256sum "$file" | cut -d' ' -f1)" ]]; then
              echo "Existing GitHub Release asset differs: $file" >&2
              exit 1
            fi
          done
