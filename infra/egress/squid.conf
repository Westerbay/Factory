# Exact names, no reverse DNS match for numeric CONNECT authorities.
http_port 0.0.0.0:3128
acl codex dstdomain -n auth.openai.com chatgpt.com api.openai.com
acl tls_port port 443
acl forbidden dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/0
include /tmp/factory-egress/host-acl.conf
http_access deny manager
http_access deny !CONNECT
http_access deny !tls_port
http_access deny !codex
http_access deny forbidden
http_access deny host_addresses
http_access allow codex
http_access deny all
cache deny all
access_log none
cache_log /dev/null
cache_store_log none
logfile_rotate 0
pid_filename /tmp/factory-egress/squid.pid
coredump_dir /tmp/factory-egress
cache_effective_user factory-proxy
cache_effective_group factory-proxy
visible_hostname factory-egress
forwarded_for delete
via off
icp_port 0
shutdown_lifetime 0 seconds
connect_timeout 10 seconds
request_header_max_size 16 KB
