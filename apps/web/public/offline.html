<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#17181a" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/brand/factory.svg" type="image/svg+xml" />
    <title>Factory — Offline</title>
    <style>
      @font-face {
        font-family: "Space Mono";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/space-mono/space-mono-latin-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "Space Mono";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/space-mono/space-mono-latin-700.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: #17181a;
        color: oklch(0.935 0.003 265);
        font-family: "Space Mono", ui-monospace, monospace;
        font-size: 0.875rem;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 30rem);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 2.5rem;
        color: inherit;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.05em;
      }
      .brand svg {
        width: 1.375rem;
        height: 1.375rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
        font-weight: 700;
        line-height: 1.4;
      }
      p {
        line-height: 1.7;
        color: oklch(0.71 0.006 265);
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        margin-top: 1rem;
        padding: 0.625rem 1rem;
        border-radius: 6px;
        background: oklch(0.935 0.003 265);
        color: #17181a;
        text-decoration: none;
        touch-action: manipulation;
        transition: opacity 120ms ease-out;
      }
      a:hover {
        opacity: 0.85;
      }
      a:focus-visible {
        outline: 2px solid oklch(0.935 0.003 265);
        outline-offset: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <path
            d="M12 17 34 39 12 61M40 62h28"
            fill="none"
            stroke="currentColor"
            stroke-width="8"
            stroke-linecap="square"
            stroke-linejoin="miter"
          /></svg
        >factory
      </p>
      <h1>You are offline</h1>
      <p>
        Connect to the internet to open your workspace. Account and workspace
        data are not available offline.
      </p>
      <a href="/app">Try again</a>
    </main>
  </body>
</html>
