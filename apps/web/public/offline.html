<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Factory — Offline</title>
    <style>
      body {
        margin: 0;
        padding: 4rem 1.5rem;
        background: #f7f8fa;
        color: #242529;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        margin: auto;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.2;
      }
      p {
        line-height: 1.7;
        color: #5d6069;
      }
      a {
        color: #5340ac;
        display: inline-block;
        padding: 0.75rem 0;
      }
      a:focus-visible {
        outline: 3px solid #7355d8;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Factory</p>
      <h1>You are offline</h1>
      <p>
        Connect to the internet to open your workspace. Account and workspace
        data are not available offline.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
